<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        AI Traffic Management Agent
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<header>

    <h1>
        🚦 AI Traffic Management Agent
    </h1>

    <p>
        Intelligent Traffic Signal Decision System
    </p>

</header>


<main>


    <!-- TRAFFIC INPUT -->

    <section class="card">

        <h2>
            🚗 Traffic Conditions
        </h2>


        <div class="grid">


            <!-- NORTH -->

            <div>

                <h3>North</h3>

                <label>
                    Number of Vehicles
                </label>

                <input
                    type="number"
                    id="northVehicles"
                    value="35"
                    min="0"
                    max="200"
                >


                <label>
                    Waiting Time (seconds)
                </label>

                <input
                    type="number"
                    id="northWait"
                    value="40"
                    min="0"
                    max="300"
                >

            </div>


            <!-- SOUTH -->

            <div>

                <h3>South</h3>

                <label>
                    Number of Vehicles
                </label>

                <input
                    type="number"
                    id="southVehicles"
                    value="12"
                    min="0"
                    max="200"
                >


                <label>
                    Waiting Time (seconds)
                </label>

                <input
                    type="number"
                    id="southWait"
                    value="15"
                    min="0"
                    max="300"
                >

            </div>


            <!-- EAST -->

            <div>

                <h3>East</h3>

                <label>
                    Number of Vehicles
                </label>

                <input
                    type="number"
                    id="eastVehicles"
                    value="60"
                    min="0"
                    max="200"
                >


                <label>
                    Waiting Time (seconds)
                </label>

                <input
                    type="number"
                    id="eastWait"
                    value="75"
                    min="0"
                    max="300"
                >

            </div>


            <!-- WEST -->

            <div>

                <h3>West</h3>

                <label>
                    Number of Vehicles
                </label>

                <input
                    type="number"
                    id="westVehicles"
                    value="20"
                    min="0"
                    max="200"
                >


                <label>
                    Waiting Time (seconds)
                </label>

                <input
                    type="number"
                    id="westWait"
                    value="30"
                    min="0"
                    max="300"
                >

            </div>

        </div>


        <!-- EMERGENCY -->

        <label class="emergency-label">

            🚨 Emergency Vehicle

        </label>


        <select id="emergency">

            <option value="None">
                None
            </option>

            <option value="North">
                North
            </option>

            <option value="South">
                South
            </option>

            <option value="East">
                East
            </option>

            <option value="West">
                West
            </option>

        </select>


        <button onclick="analyzeTraffic()">

            🚦 Analyze Traffic

        </button>

    </section>



    <!-- RESULT -->

    <section class="card result-card">

        <h2>
            🤖 AI Agent Result
        </h2>


        <div id="resultContent">

            Enter traffic information
            and click Analyze Traffic.

        </div>

    </section>



    <!-- A* ROUTE PLANNING -->

    <section class="card">

        <h2>
            🗺️ A* Route Planning
        </h2>


        <label>
            Start
        </label>


        <select id="start">

            <option>
                Home
            </option>

            <option>
                Junction A
            </option>

            <option>
                Junction B
            </option>

            <option>
                Junction C
            </option>

            <option>
                Junction D
            </option>

        </select>


        <label>
            Destination
        </label>


        <select id="destination">

            <option>
                College
            </option>

            <option>
                Hospital
            </option>

            <option>
                Junction A
            </option>

            <option>
                Junction B
            </option>

            <option>
                Junction C
            </option>

            <option>
                Junction D
            </option>

        </select>


        <button onclick="findRoute()">

            🔎 Find Best Route

        </button>


        <div id="routeResult"></div>

    </section>


</main>


<script src="{{ url_for('static', filename='script.js') }}">
</script>


</body>

</html>
